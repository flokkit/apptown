apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: janitor-fix
  title: Security fixes
  tier: core
  category: maintenance
  description: An agent updates dependencies; AppTown checks the result.
spec:
  kind: pipeline
  role: working
  stages:
    - name: update
      onEnter:
        - name: update
          uses: agent/pi
          with:
            docker: true
            needs: true
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: |
              Fix these security findings by moving each named package to the smallest
              stable release that fixes it: ${{inputs.targets}}. Direct dependencies
              take stable releases only, never a pre-release (alpha, beta, rc, dev,
              canary); an indirect package may be a pre-release when a stable direct
              dependency's own declared range requires it. Keep within patch and minor
              releases unless no such release fixes it. Pin an indirect package with
              overrides or resolutions only where that is the ecosystem's normal way,
              never to a pre-release, and say so in the commit message. If no stable
              release fixes a finding, leave that package unchanged and say so. Do not
              change .apptown/app.yaml. Fix image targets by moving FROM to the
              smallest release of the same image and variant within the level whose
              image no longer has the finding, following the janitor skill.
              For a finding in the toolchain itself (Go stdlib or a runtime), use
              the smallest patch release within its minor that fixes it, in every
              declaration: mise or version file, go.mod toolchain line and build
              image. Otherwise keep toolchain versions unchanged.
              Change application code only where a moved package needs it. Run each
              part's declared tests, then commit. If nothing can move within the level,
              change nothing. Your final message is what AppTown judges; files you write and do
              not commit are not seen. For every part, give the command you ran to
              list newer releases and the lines of its output that show the result;
              for every FROM, give the tag listing you read.
      steps:
        - name: repair
          uses: agent/pi
          with:
            docker: true
            needs: true
            repairRounds: 2
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: Make the failing check pass within this change’s intent. Write the code this update needs and run its checks. Never widen the change.
        - name: routine
          uses: routine
          with:
            rubric: |
              Judge whether this change is a dependency update within its approved level.
              AppTown's facts below name the level, any security findings it must fix,
              and how each changed file is classified; read the complete diff, including
              dependency files. Pass only when all of these hold. (1) Every version change
              in manifests and lockfiles stays within the level: at routine, patch and
              minor releases only, and a 0.x package stays within its minor; at
              aggressive, any newer release including majors. Never a downgrade, never a
              new registry or source, never a pre-release for a direct dependency or one
              pinned by an override or resolution. An indirect package in a lockfile
              may be a pre-release when a stable direct dependency's declared range
              requires it. (2) No new direct dependency, unless it replaces one the update
              removed or renamed. (3) Except for the image and toolchain moves below, every change
              outside dependency files is the
              smallest change a moved package needs: a renamed API, a changed import, a
              configuration key the new version requires. (4) Nothing else changes: no
              features, refactors, formatting, unrelated fixes, weakened or removed
              tests or .apptown/app.yaml changes. Dockerfile FROM may move within the
              level, keeping the same image and variant. Toolchain versions stay
              unchanged. A toolchain patch within its minor is allowed only when a
              named finding is in that toolchain and this is the smallest release
              that fixes it. Fail when any change falls outside
              these, and name it. Answer unclear when you cannot tell whether a code
              change is needed by a moved package. When the change is empty, pass only
              if the report names, for every part and every FROM, the command and
              output showing nothing can move within the level. A reference to a
              file is not a report;
              a truncated report cannot show that. Fail otherwise.
              Each named finding must be addressed by a package release, image move
              or toolchain patch as above; whether the scanner still reports it is
              checked separately.
        - name: tests
          uses: tests
        - name: boot
          uses: preview
        - name: scan-source
          uses: scan
          with: {on: source}
        - name: scan-image
          uses: scan
          with: {on: image}
