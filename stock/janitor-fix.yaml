apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: janitor-fix
  title: Security fixes
  tier: core
  category: maintenance
  description: Apply declared dependency updates and check the result.
spec:
  kind: pipeline
  role: working
  stages:
    - name: update
      onEnter:
        - name: update
          uses: fix
          with: {kind: update, for: findings}
      steps:
        - name: repair
          uses: agent/pi
          with:
            repairRounds: 2
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: Make the failing check pass within this change’s intent. Write the code this update needs and run its checks. Never widen the change.
        - name: tests
          uses: tests
        - name: boot
          uses: preview
        - name: scan-source
          uses: scan
          with: {on: source}
        - name: scan-image
          uses: scan
          with: {on: image}
        - name: routine
          uses: routine
