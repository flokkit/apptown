# Packs: complete ways-of-working a new project opts into (state-model §6.4).
# guidance = pinned manifest imports; workflows = installed from the library.
# tools = the version line of each tool the pack prescribes, which
# tool-versions.yaml resolves to an exact version.
packs:
  # The platform tier (design/subsystems/ways-of-working-versions.md §1.1): AppTown's
  # own coupling — health, the front door, no build artifacts — and the
  # system workflows. Every repo-backed project is on it directly; it is
  # never included in another pack and never offered in the wizard.
  - name: apptown
    platform: true
    description: |-
      App health, repository rules and platform workflows.

      What any app AppTown runs must do, and AppTown's own workflows.
      Every project with a repository is on it.
    guidance:
      - deploy/health-declared
      - deploy/browser-values
      - deploy/memory-declared
      - repo/no-build-artifacts
      - repo/contract-matches-code
    workflows: [land, ship, adopt-integration, retire-integration]
  - name: conventions-only
    description: |-
      Container builds, previews, reviews and deployment.

      AppTown's own conventions and nothing else: no language, no
      framework, no data opinion. Anything with a Dockerfile or a static
      folder gets previews, review, landing and deployment.
    guidance:
      - build/container-image
      - build/registries
      - build/toolchain-mise
      - prose/no-claude-speak
    workflows: [land, implement, quick-change, fix-bug, research, excavate]
    policies: [deploy-requires-scan, scanner-bound]
  # A server project takes server-base, one backend pack, the postgres
  # pack when it keeps records, and a UI pack when it has a browser UI.
  # It gets the union; packs that disagree on a tool's line, the
  # toolchain, a service or a policy cannot be taken together.
  - name: server-base
    description: |-
      Shared server architecture, builds, dependencies and reviews.

      What every server project shares: the container image, package
      registries, the mise toolchain, plain prose, boring technology, a
      modular monolith, few dependencies and plain REST. Take it with one
      backend pack.
    guidance:
      - build/container-image
      - build/registries
      - build/toolchain-mise
      - prose/terse-style
      - prose/no-claude-speak
      - prose/readme-plain
      - arch/boring-technology
      - dev/process-and-container-mode
      - arch/modular-monolith
      - deps/minimal-deps
      - api/rest-pragmatist
      - api/sse-over-websockets
    workflows: [land, implement, fix-bug, quick-change, plan-execute, dependency-uplift, adopt-integration, retire-integration, product-spec, research, excavate]
    policies: [deploy-requires-scan, scanner-bound]
  - name: go
    description: |-
      Go services using standard HTTP and gofmt.

      Go services: one static binary, the standard library's HTTP, gofmt.
      Take it with server-base.
    tools: {go: "1.27"}
    toolchain: go
    extensions: [lsp]
    guidance:
      - lang/selection/go-for-services
      - lang/go/formatting
      - lang/go/errors-are-values
      - lang/shell/fifty-line-budget
  - name: node
    description: |-
      Experimental TypeScript services with Node and Fastify.

      Experimental: its landing fixes have not shipped a new app yet. TypeScript on Node: a Fastify
      server, one npm package graph, one image that runs `node --run start`.
      Take it with server-base. The first change writes the app.
    tools: {node: "24"}
    toolchain: node
    extensions: [lsp]
    guidance:
      - lang/selection/node-fullstack
  - name: django
    description: |-
      Django with forms, authentication, ORM and administration.

      Django with its ORM, forms, auth and admin. Take it with server-base
      and postgres.
    tools: {python: "3.12"}
    toolchain: python
    extensions: [lsp]
    guidance:
      - lang/selection/django-fullstack
  - name: rails
    description: |-
      Rails 8 with Puma and propshaft.

      Rails 8 on Ruby 3.4 with Puma and propshaft. Starts from `rails new` on
      the first change. Take it with server-base and postgres.
    tools: {ruby: "3.4"}
    toolchain: ruby
    guidance:
      - lang/selection/rails
  - name: java
    description: |-
      Experimental Spring Boot services with Maven and Flyway.

      Experimental: its landing fixes have not shipped a new app yet. Spring Boot on Temurin 21, Maven
      and Flyway, deployed as an executable jar. Starts from Spring
      Initializr on the first change. Take it with server-base and postgres.
    tools: {java: "21", maven: "3.9"}
    toolchain: java
    guidance:
      - lang/selection/java-spring-boot
      - lang/java/spring-conventions
  - name: dotnet
    description: |-
      Experimental ASP.NET Core APIs with EF Core.

      Experimental: not yet run in production by the maintainers for two weeks, and its SDK download is not mirrored. ASP.NET Core on .NET 10: minimal APIs and EF Core,
      one published app. Starts from the SDK's own templates on the first
      change. Take it with server-base and postgres.
    tools: {dotnet: "10"}
    toolchain: dotnet
    guidance:
      - lang/selection/dotnet-aspnet
  - name: rust
    description: |-
      Experimental Rust services with minimal dependencies.

      Experimental: not yet run in production by the maintainers for two weeks with a clean image scan. Stable Rust, std-first services, minimal crates, deployed as a
      release binary. Take it with server-base.
    tools: {rust: "1.84"}
    toolchain: rust
    guidance:
      - lang/selection/rust
  - name: wordpress
    description: |-
      Experimental WordPress with MariaDB and object storage.

      Experimental: no app shipped from the current starter yet. WordPress with Composer-locked core and plugins, an
      immutable PHP/Apache image, deployment-owned MariaDB, and uploads in
      the deployment's own object storage. Starts with a small neutral
      theme. Take it with server-base.
    tools: {mariadb: "11.4", php: "8.3"}
    services:
      - name: mariadb
        image: mariadb:11.4.13
        env: {MARIADB_DATABASE: app, MARIADB_USER: app, MARIADB_PASSWORD: app, MARIADB_RANDOM_ROOT_PASSWORD: "1"}
      # No image: the s3 kind has no version for the wizard to read from a tag.
      - name: s3
    guidance:
      - lang/selection/wordpress-bedrock
  - name: postgres
    description: |-
      Deployment databases using Postgres.

      Records in Postgres, reached through the deployment's need: the
      database is a service, never a file.
    tools: {postgres: "16"}
    services:
      - name: postgres
        image: postgres:16
        env: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    guidance:
      - data/postgres-maximalism
      - data/networked-database
  - name: vite-react
    description: |-
      React browser interfaces built with Vite.

      A browser UI in TypeScript and React, built with Vite and served by
      the app's server.
    tools: {node: "24"}
    guidance:
      - frontend/vite-react
  - name: server-rendered
    description: |-
      Server templates with HTMX or Hotwire.

      Pages rendered on the server with the framework's templates, and
      HTMX or Hotwire where a page must feel live. No JavaScript build.
    guidance:
      - frontend/server-rendered
  - name: html-game
    description: |-
      Browser games in plain HTML, CSS and JavaScript.

      Browser games in plain HTML, CSS and JavaScript: no server, no build
      step, no dependencies. The file you edit is the file that ships.
      Starts with a small working game to change.
    guidance:
      - game/client-only
      - game/no-toolchain
      - game/kid-readable
      - game/playable-everywhere
      - prose/readme-plain
      - prose/no-claude-speak
    workflows: [land, ship, implement, quick-change, fix-bug]
    policies: [deploy-requires-scan, scanner-bound]
  - name: godot-3d
    description: |-
      Experimental Godot 3D games for the browser.

      Experimental: the current starter has not shipped an app yet. 3D games built with the Godot 4 engine and exported to the browser as
      WebAssembly. GDScript, the Compatibility renderer, threads off, and a
      Dockerfile that exports and serves the game. Starts with a small
      working first-person game to change.
    tools: {godot: "4.4"}
    guidance:
      - game/godot-web
      - game/player-first
      - build/registries
      - build/container-image
      - prose/readme-plain
      - prose/no-claude-speak
    workflows: [land, ship, implement, quick-change, fix-bug]
    policies: [deploy-requires-scan, scanner-bound]
  - name: video-game
    description: |-
      Experimental browser games using npm libraries.

      Experimental: the current starter has not shipped an app yet. Browser games built with npm libraries such as three.js, a bundler,
      and TypeScript where it helps. Players need only the link. Starts
      with a small working 3D game to change.
    tools: {node: "24"}
    toolchain: node
    guidance:
      - game/open-toolchain
      - game/player-first
      - game/playable-everywhere
      - build/registries
      - build/container-image
      - prose/readme-plain
      - prose/no-claude-speak
    workflows: [land, ship, implement, quick-change, fix-bug]
    policies: [deploy-requires-scan, scanner-bound]
  - name: frontend-only
    description: |-
      Browser apps with local data and offline support.

      Apps that run entirely in the browser: no server. TypeScript built
      with Vite, a few npm libraries, tests with Vitest, data kept in the
      browser, and working offline where the app needs it. Starts with a
      small working app to change.
    tools: {node: "24"}
    toolchain: node
    extensions: [lsp]
    guidance:
      - frontend/browser-only
      - frontend/vite-react
      - data/large-data-files
      - deps/minimal-deps
      - build/registries
      - build/container-image
      - build/toolchain-mise
      - prose/terse-style
      - prose/readme-plain
      - prose/no-claude-speak
    workflows: [land, ship, implement, quick-change, fix-bug, dependency-uplift, research]
    policies: [deploy-requires-scan, scanner-bound]
