# Stock workflow: implement — build an application (or a substantial new
# capability) from a brief or an accepted specification, on the Change
# branch. Merged from `build` (brief-driven) and the old `implement`
# (spec-driven), 2026-09-03 (design/decisions/workflows-as-lanes.md): one lane, one
# human acceptance; the agent follows a spec's technology decisions when
# one is attached and the change's description otherwise. Landing ships.
apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: implement
  tier: core
  category: change
  description: >-
    Build an application or a larger feature from a brief or an accepted spec. An agent builds it, testing as it goes, then checks it end to end with the app's declared services running; a second agent reviews the report, and one person accepts it.
spec:
  kind: lifecycle
  role: working
  workspace: project
  defaults:
    thinking: medium
  stages:
    - name: build
      onEnter:
        - name: build-app
          uses: agent/pi
          with:
            skills: [skill/implementation]
            docker: true
            needs: true # the app contract's declared needs run as emulators + env
            output: { kind: build-report, name: build-report, file: .apptown/REPORT.md }
            timeoutMinutes: 40
            prompt: |
              Build what is described below in the CURRENT WORKING DIRECTORY —
              source files and config, and BUILD.md at the root when the
              project has a toolchain (an install, build or test command).
              If an accepted
              SPECIFICATION is included, follow its technology decisions
              exactly; otherwise the DESCRIPTION is your brief. Use your bash
              tool to verify what you build as you go. Follow your steering
              guidance, including the attached-integration sections — wire
              each attached service exactly as its steering says. Keep
              dependencies minimal. You are building inside a Linux container.
              Never commit build artifacts, compiled binaries, or database
              files: when anything you build or run writes them, write a
              .gitignore that covers them before you first build or run it.
              A project of plain files that ship as they are (nothing to
              install or build) needs neither BUILD.md nor a .gitignore, and
              adding one is a change the request did not ask for.

              Before finishing, bring dependencies to their current patch and
              minor levels (your training-era pins are stale and will trip
              the landing's vulnerability scan) and re-verify.

              Write .apptown/REPORT.md EARLY — create it as soon as the shape of the
              build is clear and keep it updated as you verify; a report that
              exists at 90% is worth more than a perfect one that never gets
              written. Also write the run contract to .apptown/app.yaml — the
              forge-native contract with two sections. `app:` is a map of your
              app's own containers (each with build:/image:/static:, ports,
              environment, command); exactly one part is `public: true` (the
              front door). `needs:` is a map of dependencies AppTown provisions
              and injects env for — `needs: { postgres: { version: "16" } }` —
              read the injected DATABASE_URL / PG* / REDIS_URL / AWS_*, never
              hard-code a host. Get the schema with `apptown config schema` and
              check your file with `apptown config validate`; rehearse locally with
              `apptown dev up`. The app must listen on $PORT when set.

              If a reviewer has previously rejected this work, their feedback
              is: ${{feedback.latest}}
              Address it precisely.

              When done, WRITE your build report to .apptown/REPORT.md (what you built, what you verified with which commands,
              deviations). Chat output is not captured. Do not commit the report: AppTown
              collects it from the workspace, and .apptown/ is ignored.
              The report describes the WHOLE change: the full branch diff
              against the base, not just this session's edits. After rework
              rounds, run git diff against the base branch and account for
              EVERY changed file — an unclaimed change reads as deception to
              the reviewer. Files a generator wrote (rails new, uv init) are
              accounted for by naming their directory (`app/`, `config`,
              `bin`); a file at the top level, a dotfile included, is named
              itself.

              --- SPECIFICATION (if any) ---

              ${{latest.spec-final}}

              --- DESCRIPTION ---

              ${{change.body}}
        - name: self-verify
          uses: agent/pi
          with:
            skills: [skill/implementation]
            docker: true
            needs: true
            output: { kind: verify-report, name: verify-report, file: .apptown/VERIFY.md }
            timeoutMinutes: 25
            prompt: |
              You are in the workspace of the freshly implemented application
              (BUILD.md or README.md at the root says how to run it, the build
              report is in .apptown/REPORT.md).
              Verify it end to end with your bash tool: install, build, run the
              test suite, start the app and exercise its main flows. Your app's
              declared needs are running as emulators, reachable by capability
              hostname (postgres, redis, …, NOT localhost), with their
              connection env already set ($DATABASE_URL, $PG*, $REDIS_URL, …) —
              read it; do NOT install database servers or hard-code hosts.

              You VERIFY this change; you do not widen it. Fix only defects in
              what this change itself did. If verifying needs something the app
              lacks — a runtime contract, a health endpoint, a build file, a
              dependency — do NOT add it: record it under "Defects remaining"
              and stop there. Anything you do change must be listed in
              VERIFY.md under "Also changed, and why", one line per file; an
              unexplained change fails review. The change's request, with its
              scope, is:

              ${{change.body}}

              You are also the step a rejection comes back to: when the
              reviewer, a check or a person rejects this work, this step runs
              again with their words. If there is feedback here, address it
              precisely — fixing what it names is within this change's scope —
              and then verify again: ${{feedback.latest}}

              WRITE your verification report to .apptown/VERIFY.md. It is the
              report the reviewer reads, so it describes the change as it
              stands NOW, not as the first build left it: run git diff
              against the base branch and start with what the change does,
              accounting for EVERY changed file (the build report in
              .apptown/REPORT.md is a starting point, but it is not updated
              after rework). Then: commands run, results, defects fixed,
              feedback addressed, defects remaining. Chat output is not
              captured. Do not commit the report: AppTown collects it from
              the workspace, and .apptown/ is ignored.
              If the change affects pages a person would look at, end the
              report with one line `Pages: /path /other/path` naming up to
              three of them (paths on the app). AppTown pictures them, and
              the home page, for whoever approves.
        - name: boot
          uses: preview
      steps:
        - name: report-exists
          uses: artifact/require
          with: { kind: build-report }
        - name: verify-report-exists
          uses: artifact/require
          with: { kind: verify-report }
        - name: guidance-conformance
          uses: guidance/conformance
        # The review reads the verification report: rework and retries
        # rerun self-verify (the stage's last agent step), which rewrites
        # VERIFY.md every round, while REPORT.md stays as the first build
        # left it.
        - name: review-build
          uses: agent/review
          with:
            model: review
            of: verify-report
            prompt: >-
              If the diff adds or changes a form, or a handler a form posts
              to, the report must say the form was submitted once against
              the running app and what came back (the status, and the page
              or redirect). A form that was never submitted, or whose submit
              failed, is a finding.

              Open the running app yourself. This change's preview is recorded at
              ${{preview.url}}. Request its home page and each page the request names
              or the diff changes, as a visitor would:
              curl -sS -D /tmp/head.txt -o /tmp/page.html -w '%{http_code}' -H "Host: ${{preview.host}}" "$APPTOWN_URL/<path>"
              (AppTown serves the preview by that host) and read the saved page. A page
              that is an error (a 5xx, an exception or stack trace, PHP's "Fatal
              error"), that is empty, or that is plainly unstyled where the request asked
              for a look, is a finding. Follow a redirect to the same preview by
              requesting its path the same way; a redirect elsewhere (an outside sign-in)
              is an answer, not a failure. Name each URL you opened and its status in
              the summary. If no preview URL is recorded, say so; if the preview could
              not be opened, say that separately.
        - name: accept
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: "I read the report and the diff, and this is work I am willing to ship under my name."
            # A yes given before the work exists (an adoption's opener can give
            # one): what it means, on the condition AppTown witnesses.
            inAdvance: "I accept this change before it is worked, on a condition AppTown checks: it changes no code, and every step of its run passes with every check passing, none excused."
            instructions: "Read VERIFY.md (the change as it stands) and the diff, and try the preview. To send it back, reject with a comment."
