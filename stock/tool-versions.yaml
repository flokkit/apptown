# Tool versions: what each version line names exactly
# (design/subsystems/ways-of-working-versions.md). A pack names a line (tools: {node:
# "24"}); this list says which exact version and image digest the line means.
# The build stamps name and published, as for update.yaml.
#
# In this release AppTown uses only the four runtime images below (apptown-sh,
# apptown-df, static-server, private-docker). The other entries are the lines
# packs may name; resolving them for runs and new projects comes later.
# private-docker moves only with an AppTown release: its digest is part of the
# qualified worker profile (internal/execution/qualified_profiles.json).
#
# Every image names a digest. Lines are only added; a line past its end of
# life stays with its last exact version.
apiVersion: apptown.dev/v1
kind: ToolVersions
worksWith: ">=1.0.0"
tools:
  # The shell every guidance check, and AppTown's cache sweep, runs in.
  apptown-sh:
    "1": {version: v2.47.2, images: {run: "alpine/git:v2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c"}}
  # The df behind disk-space reads through Docker.
  apptown-df:
    "1": {version: 1.37.0, images: {run: "busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e"}}
  # Serves static output in release images and local compose.
  static-server:
    "2": {version: 2.10.2, images: {run: "caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d"}}
  # The private Docker daemon of a chat or task.
  private-docker:
    "27": {version: 27.5.1, images: {run: "docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce"}}
  go:
    "1.27": {version: 1.27.0}
  node:
    "24": {version: 24.22.1}
  python:
    "3.12": {version: 3.12.15}
  java:
    "21": {version: 21.0.5+11, label: "Java 21 (Temurin)"}
  maven:
    "3.9": {version: 3.9.9}
  dotnet:
    "10": {version: 10.0.13, label: ".NET 10 (LTS)"}
  ruby:
    "3.4": {version: 3.4.12}
  rust:
    "1.84": {version: 1.84.0}
  # The Godot engine the godot-web-export check's image pins.
  godot:
    "4.4": {version: 4.4.1}
  # The PHP the WordPress starter's runtime image runs.
  php:
    "8.3": {version: 8.3.35}
  postgres:
    "16": {version: "16.15", images: {run: "postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36"}}
  mariadb:
    "11.4": {version: 11.4.13, images: {run: "mariadb:11.4.13@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873"}}
