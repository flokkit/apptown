# Dependency: error reporting.
# A NEED fulfilled by REGISTERING with the shared org GlitchTip — the app gets
# its own project (and DSN) inside the org instance. REGISTER strategy; the
# adapter creates the project and injects the DSN. Execution wraps the existing
# provisionErrors path in the register-executor slice.
capability: errors
title: Error reporting
icon: 🐛
description: Collects the app's uncaught errors in one place, with stack traces, grouped and counted. The app reads a DSN.

# An integration, not a need: its values come from the project's attached
# integration, and declaring it under needs: is refused.
integration: true
provides:
  SENTRY_DSN: where the app reports errors, while error reporting is attached (any Sentry-compatible SDK reads it)

register:
  connector: glitchtip           # capability=errors provider in the connector catalog
  adapter: glitchtip-project      # creates a project, returns its DSN
  # The one list of what an app with error reporting is given (the browser is
  # given only the entries that carry the DSN, as its public form).
  inject:
    # One standard name, whichever provider is attached; framework settings
    # (Spring's resolver order) belong to that framework's pack.
    SENTRY_DSN: "${dsn}"
