# Dependency: AI models.
# A NEED fulfilled by REGISTERING with OpenRouter: each deployment, and each
# preview, gets its own OpenRouter API key with a credit limit, made through
# the project's attached `llm` connector and revoked when the deployment is
# taken down or the preview ends. The connector's provisioning key never
# reaches the app.
#
# Parameters, in .apptown/app.yaml:
#   needs:
#     llm:
#       limit: 5            # US dollars of credit; omitted = the connector's default
#       limitReset: monthly # daily | weekly | monthly; omitted = never resets
# The limit may not exceed the connector's maximum. Previews always get the
# connector's preview limit.
capability: llm
title: AI models
icon: ✨
description: "Experimental: no deployed app has used its own key yet. Lets the app call AI models (chat, summarising, extraction) through an OpenAI-compatible chat-completions API. A need fulfilled through an integration: each deployment and each preview gets its own key with a spending limit, made through the attached OpenRouter integration. The app reads LLM_API_KEY and LLM_BASE_URL."
summary: "Calls AI models through an OpenAI-compatible API, with a spending limit."
status: experimental

# The parameters above, which have no default.
parameters: [limit, limitReset]

# The contract with the app, the same on every target and for a preview: an
# API key and the base URL of an OpenAI-compatible chat-completions API (an
# OpenAI SDK takes both as they are). The provider behind it is the
# connector's, OpenRouter today, so the names do not say it.
provides:
  LLM_API_KEY: this deployment's (or preview's) own key, with its spending limit
  LLM_BASE_URL: the base URL of the OpenAI-compatible API to call

register:
  connector: openrouter     # capability=llm provider in the connector catalog
  adapter: openrouter-key   # creates one key per deployment or preview
  inject:
    LLM_API_KEY: "${key}"
    LLM_BASE_URL: "${base_url}"
