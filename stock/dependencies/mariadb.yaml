# Local MariaDB, fulfilled by the generic dependency catalogue.
capability: mariadb
resources: {memory: 256M}
title: MariaDB
icon: 🐬
description: A deployment-owned relational database, reached with DB_* variables.
summary: "A relational database of the app's own."
defaults:
  # Fixed for every 1.x release (dependency.defaultVersions1x).
  version: "11.4.13"
  database: app
  user: app
# AppTown sets the password. Each deployment and each preview gets one of
# its own (generate); the value here is only for the servers AppTown
# starts beside its own steps and apptown dev.
credentials:
  password: app
generate: [password]
# The contract with the app, the same on every target.
provides:
  DB_HOST: the server's host
  DB_PORT: the server's port
  DB_NAME: the app's database
  DB_USER: the app's user, with every right on the database
  DB_PASSWORD: the user's password, set by AppTown
  DB_SSL_MODE: DISABLED or REQUIRED (MySQL's words), whether the connection must use TLS
local:
  image: mariadb:{version}
  port: 3306
  # The start script makes the server's data folder itself on the first
  # start, and makes the app's database and user, with its password, at
  # every start, through the server's own init file. That file runs with
  # every right and needs no root password (root signs in only from inside
  # the container). The image's own first-start setup is not used: it waits
  # about 30 seconds for a temporary server and gives up on a busy host,
  # leaving a server without the app's database. A standing server takes a
  # new password at its next deploy and keeps its data (configAtStart). Its
  # data is in the image's own format, so a new image is not a reason to
  # remake it (keepsImage). The command stays the server's own flags (sizes
  # replace it): the script passes them on.
  configAtStart: true
  keepsImage: true
  entrypoint:
    - /bin/sh
    - -c
    - |
      set -eu
      quoted() { printf "'%s'" "$(printf %s "$1" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g")"; }
      user=$(quoted "$MARIADB_USER")
      database=$(printf %s "$MARIADB_DATABASE" | sed 's/`/``/g')
      # A grant names its database as a pattern: \, _ and % are escaped there
      # so that each matches only itself.
      pattern=$(printf %s "$database" | sed -e 's/\\/\\\\/g' -e 's/[_%]/\\&/g')
      umask 077
      first=
      if [ ! -d /var/lib/mysql/mysql ]; then
        # The server's own flags (sizes) go to the setup's server too: with
        # the default buffer pool it does not fit a small need's memory.
        mariadb-install-db --user=mysql --datadir=/var/lib/mysql --skip-test-db --auth-root-authentication-method=socket "$@" > /dev/null
        first=1
      fi
      # The last start's file is the server's (chowned below). Linux refuses
      # root a write to another user's file in the shared /tmp
      # (fs.protected_regular, on by default), so it is removed and made anew.
      rm -f /tmp/forge-init.sql
      {
        printf '%s\n' "CREATE DATABASE IF NOT EXISTS \`$database\`;"
        printf '%s\n' "CREATE USER IF NOT EXISTS $user@'%';"
        printf '%s\n' "ALTER USER $user@'%' IDENTIFIED BY $(quoted "$MARIADB_PASSWORD");"
        printf '%s\n' "GRANT ALL PRIVILEGES ON \`$pattern\`.* TO $user@'%';"
        if [ -n "$first" ]; then
          printf '%s\n' "USE mysql;"
          mariadb-tzinfo-to-sql --skip-write-binlog /usr/share/zoneinfo 2> /dev/null
        fi
      } > /tmp/forge-init.sql
      chown mysql:mysql /tmp/forge-init.sql
      exec docker-entrypoint.sh mariadbd --init-file=/tmp/forge-init.sql "$@"
    - mariadb
  command: ["--innodb-buffer-pool-size=64M", "--max-connections=20", "--performance-schema=OFF"]
  health: healthcheck.sh --connect --innodb_initialized
  data: /var/lib/mysql
  # How much data it holds, read before and after each release, from the
  # catalogue's estimates, as the app's own user.
  measure: >-
    MYSQL_PWD="$MARIADB_PASSWORD" mariadb -u"$MARIADB_USER" -N -B "$MARIADB_DATABASE" -e "
    select 'tables', count(*) from information_schema.tables where table_schema = database() and table_type = 'BASE TABLE'
    union all select 'rows', coalesce(sum(table_rows), 0) from information_schema.tables where table_schema = database()
    union all select 'bytes', coalesce(sum(data_length + index_length), 0) from information_schema.tables where table_schema = database()"
  env:
    MARIADB_DATABASE: "{database}"
    MARIADB_USER: "{user}"
    MARIADB_PASSWORD: "{password}"
    MARIADB_RANDOM_ROOT_PASSWORD: "1"
    MARIADB_ROOT_HOST: localhost
  inject:
    DB_HOST: "{host}"
    DB_PORT: "3306"
    DB_NAME: "{database}"
    DB_USER: "{user}"
    DB_PASSWORD: "{password}"
    DB_SSL_MODE: DISABLED
# Deterministic SQL: no timestamps, bulk INSERT groups, or transient locks.
# Verification preserves DDL order and sorts only complete INSERT lines (which
# carry their table name). Never globally sort SQL: that detaches column
# definitions from their tables and can falsely verify a changed schema.
# DELIMITER blocks (triggers) stay intact, including their INSERT statements.
copy:
  format: mariadb-sql
  ext: sql
  client: mariadb:{version}
  export: >-
    mariadb-dump --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER"
    --single-transaction --skip-comments --skip-extended-insert --skip-add-locks
    --order-by-primary --hex-blob "$DB_NAME"
  import: mariadb --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" "$DB_NAME"
  restore: mariadb --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" "$DB_NAME"
  env:
    DB_HOST: "{host}"
    DB_PORT: "{port}"
    DB_NAME: "{database}"
    DB_USER: "{user}"
    MYSQL_PWD: "{password}"
  verify: |
    set -eu
    work=$(mktemp -d)
    trap 'rm -rf "$work"' EXIT
    cat > "$work/copy"
    test -s "$work/copy" || { echo 'empty logical copy'; exit 1; }
    mariadb-dump --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" \
      --single-transaction --skip-comments --skip-extended-insert --skip-add-locks \
      --order-by-primary --hex-blob "$DB_NAME" > "$work/live"
    for name in copy live; do
      : > "$work/$name.rows"
      awk -v rows="$work/$name.rows" '
        /^DELIMITER / { delimiter = $2 }
        /^INSERT INTO / && (delimiter == "" || delimiter == ";") { print > rows; next }
        { print }
      ' "$work/$name" > "$work/$name.schema"
      LC_ALL=C sort -o "$work/$name.rows" "$work/$name.rows"
    done
    cmp "$work/copy.schema" "$work/live.schema" && cmp "$work/copy.rows" "$work/live.rows"
  caveat: >-
    Logical tables, views and triggers only; routines, events, users and grants
    are not copied. Use transactional tables and avoid concurrent DDL during
    export. Verification compares the complete schema and rows at verification
    time, so verify a quiescent restore, not a database receiving writes.
    Restore replaces tables named by the copy; extra destination objects remain
    and cause verification to fail. This is not a coordinated S3/database backup.

sizes:
  small:
    description: Dedicated low-concurrency MariaDB container; validate workload and maintenance within 128 MiB.
    resources: {memory: 128M}
    command:
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=4M
      - --aria-pagecache-buffer-size=8M
      - --key-buffer-size=64K
      - --max-connections=10
      - --thread-cache-size=2
      - --table-open-cache=128
      - --table-definition-cache=400
      - --tmp-table-size=4M
      - --max-heap-table-size=4M
      - --performance-schema=OFF
