# Stock workflow: product-spec. The accepted specification is a record the
# forge keeps (the spec-final artifact), not a file in the repository: an
# implement run reads it as ${{latest.spec-final}}. Its role is record:
# accepting the spec closes the change, and nothing lands.
apiVersion: forge.flokkit.io/v1
kind: Workflow
metadata:
  name: product-spec
  tier: extra
  category: knowledge
  description: >-
    Experimental: little use so far. Turn a rough product idea into a reviewed specification for one iteration. An agent drafts it, a person reviews it, and the agent revises it.
spec:
  role: record
  kind: lifecycle
  defaults:
    thinking: medium
  stages:
    - name: draft
      onEnter:
        - name: draft-spec
          uses: agent/pi
          with:
            skills: [skill/spec-development]
            resources: [resource/spec-template]
            output: { kind: spec, name: spec-draft, file: .forge/SPEC.md }
            timeoutMinutes: 12
            prompt: |
              Half-formed product idea, titled "${{change.title}}":

              ${{change.body}}

              Develop this into a complete FIRST-ITERATION specification using your
              spec-development skill and the spec template resource file. Your
              steering guidance defines the technology stack — follow it. WRITE
              the completed specification to .forge/SPEC.md —
              the file is the deliverable; keep chat output to a one-line note.
      steps:
        - name: spec-exists
          uses: artifact/require
          with: { kind: spec }
        - name: review-spec
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: "The spec describes what I actually want built."
            instructions: "Read the spec. Approve it, or reject with comments."
    - name: finalize
      onEnter:
        - name: tighten-spec
          uses: agent/pi
          with:
            skills: [skill/spec-development]
            output: { kind: spec-final, name: spec-final, file: .forge/SPEC.md }
            timeoutMinutes: 12
            prompt: |
              Below is a reviewed draft specification. Critique it against your
              skill's quality bar, then produce the FINAL version: cut anything
              that is not first-iteration, resolve vagueness, keep the same
              template structure. WRITE the final document to .forge/SPEC.md in the
              workspace root (overwrite it) — the file is the deliverable.

              ---

              ${{artifact.spec}}
      steps:
        - name: final-exists
          uses: artifact/require
          with: { kind: spec-final }
        - name: accept-spec
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: "This spec is final: work built to it is what I want built."
            instructions: "Accept the spec as final, or reject with comments."
