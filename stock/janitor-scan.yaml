apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: janitor-scan
  title: Security fixes
  tier: core
  category: maintenance
  description: Scan the project's code and running images for findings.
spec:
  kind: pipeline
  role: working
  on:
    schedule: {cron: "0 5 * * *", queue: security, standing: true}
  stages:
    - name: scan
      steps:
        - name: scan-source
          uses: scan
          with: {on: source, baseline: none}
        - name: scan-running
          uses: scan
          with: {on: running}
        - name: fix
          uses: workflow/call
          with:
            workflow: janitor-fix
            whenFailed: [scan-source]
            findings: fixable
        - name: accept
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: I accept this dependency update and its application repairs after checking the evidence.
            standing:
              class: routine-update
              means: The declared dependency update stays within the selected bound and every required check is met.
      gate:
        require: [fix, accept]
