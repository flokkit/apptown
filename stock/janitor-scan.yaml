apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: janitor-scan
  title: Security fixes
  tier: core
  category: maintenance
  description: Scan the project's code and running images for findings.
spec:
  kind: pipeline
  role: working
  on:
    schedule: {cron: "0 5 * * *", queue: security, standing: true}
  stages:
    - name: scan
      steps:
        - name: scan-source
          uses: scan
          with: {on: source, baseline: none}
        - name: scan-running
          uses: scan
          with: {on: running}
        - name: fix
          uses: workflow/call
          with:
            workflow: janitor-fix
            whenFailed: [scan-source]
            findings: fixable
        - name: accept
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: I accept this dependency update and its application repairs after checking the evidence.
            standing:
              class: routine-update
              means: An AI model judged the security fix within the selected level and limited to dependencies and the code they need, AppTown saw toolchain versions and base images unchanged and the scanner no longer reporting the finding, and every required check is met.
      gate:
        require: [fix, accept]
