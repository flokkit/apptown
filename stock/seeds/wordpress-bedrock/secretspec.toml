[project]
name = "wordpress"
revision = "1.0"

[profiles.default]
WP_HOME = {description = "canonical site address; unset, the site uses the address this deployment is served at", required = false}
AUTH_KEY = {description = "Stable generated AUTH_KEY", generate = true}
SECURE_AUTH_KEY = {description = "Stable generated SECURE_AUTH_KEY", generate = true}
LOGGED_IN_KEY = {description = "Stable generated LOGGED_IN_KEY", generate = true}
NONCE_KEY = {description = "Stable generated NONCE_KEY", generate = true}
AUTH_SALT = {description = "Stable generated AUTH_SALT", generate = true}
SECURE_AUTH_SALT = {description = "Stable generated SECURE_AUTH_SALT", generate = true}
LOGGED_IN_SALT = {description = "Stable generated LOGGED_IN_SALT", generate = true}
NONCE_SALT = {description = "Stable generated NONCE_SALT", generate = true}
WP_ADMIN_PASSWORD = {description = "Stable generated WP_ADMIN_PASSWORD", generate = true}

[scopes.web]
secrets = ["WP_HOME", "AUTH_KEY", "SECURE_AUTH_KEY", "LOGGED_IN_KEY", "NONCE_KEY", "AUTH_SALT", "SECURE_AUTH_SALT", "LOGGED_IN_SALT", "NONCE_SALT"]

[scopes.init-install]
secrets = ["WP_HOME", "AUTH_KEY", "SECURE_AUTH_KEY", "LOGGED_IN_KEY", "NONCE_KEY", "AUTH_SALT", "SECURE_AUTH_SALT", "LOGGED_IN_SALT", "NONCE_SALT", "WP_ADMIN_PASSWORD"]
