# Stock workflow: retire-integration — the half nobody does: when the org
# retires or replaces a cross-cutting service, unwire it cleanly. The lane
# proves nothing still references the retired service.
apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: retire-integration
  system: true
  category: integration
  description: >-
    Remove a retired integration from the app, and check that nothing still refers to it and the app runs without it.
spec:
  kind: lifecycle
  role: working
  workspace: project
  defaults:
    thinking: medium
  stages:
    - name: unwire
      onEnter:
        - name: unwire-integration
          uses: agent/pi
          with:
            skills: [skill/implementation]
            docker: true
            needs: true # the app contract's declared needs run as emulators + env
            output: { kind: retire-report, name: retire-report, file: .apptown/RETIRE.md }
            timeoutMinutes: 25
            prompt: |
              Before finishing, run each part’s declared `test:` commands in its folder,
              then commit your changes. Run `apptown check` and
              fix introduced failures and this change's acceptance checks.
              Run `apptown dev up` and open the pages this change touches.
              Say in your report what ran and what came back. Report
              pre-existing or undecided findings without widening the change.
              If you cannot honestly satisfy a check, stop and list ALL
              blockers in your report, using this declared field:
              Blockers:
              - What you cannot do and what you need from a person.
              Use one bullet per blocker, each on one line.
              A blocker is anything outside this repository that the change
              needs: a decision, a secret, access, a setting only a person can
              change (for example a stored preview secret), or a smaller request.
              Anything your report says a person or operator must do belongs
              in Blockers. If you were sent back for such a reason, declare it
              as a blocker rather than trying again. Do not finish with a
              preview that fails to start unless the reason is listed in Blockers.
              Do not work around a check you cannot satisfy.

              An organisational service is being retired from this project —
              the Change below names it. Remove its wiring completely:

              - Delete the SDK initialisation, config plumbing, and any
                dependency used only for that service.
              - Search the tree for remaining references (env var names, SDK
                imports, config keys) and remove them; list your search
                commands and their (empty) results as proof.
              - The app must build, pass tests, and run cleanly afterwards.
              - If a reviewer previously rejected this work, their feedback:
                ${{feedback.latest}}

              WRITE .apptown/RETIRE.md: what was removed,
              dependencies dropped, the reference-search proof, verification
              results. Chat output is not captured.

              --- CHANGE ---

              ${{change.body}}
        - name: boot
          uses: preview
      steps:
        - name: guidance-conformance
          uses: guidance/conformance
        - name: report-exists
          uses: artifact/require
          with: { kind: retire-report }
        - name: review-removal
          uses: agent/review
          with:
            model: review
            of: retire-report
            prompt: >-
              Grep the diff and report for leftovers: any remaining import,
              env var read, or dependency of the retired service fails the
              review. Confirm the removal is complete, not commented out.

              Open the running app yourself. This change's preview is recorded at
              ${{preview.url}}. Request its home page and each page the request names
              or the diff changes, as a visitor would:
              curl -sS -D /tmp/head.txt -o /tmp/page.html -w '%{http_code}' -H "Host: ${{preview.host}}" "$APPTOWN_URL/<path>"
              (AppTown serves the preview by that host) and read the saved page. A page
              that is an error (a 5xx, an exception or stack trace, PHP's "Fatal
              error"), that is empty, or that is plainly unstyled where the request asked
              for a look, is a finding. Follow a redirect to the same preview by
              requesting its path the same way; a redirect elsewhere (an outside sign-in)
              is an answer, not a failure. Name each URL you opened and its status in
              the summary. If no preview URL is recorded, say so; if the preview could
              not be opened, say that separately.
        - name: accept
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: "I confirmed the removal is complete: nothing is left commented out or unused."
            instructions: "Read the retire report and the diff. To send it back, reject with a comment."
