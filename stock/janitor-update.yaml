apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: janitor-update
  title: Dependency updates
  tier: core
  category: maintenance
  description: An agent updates dependencies; AppTown checks the result.
spec:
  kind: pipeline
  role: working
  on:
    schedule: {cron: "0 6 * * 1", aggressiveCron: "0 6 * * *", queue: updates, standing: true}
  stages:
    - name: update
      onEnter:
        - name: update
          uses: agent/pi
          with:
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: |
              Update this project's dependencies at level ${{inputs.level}}: routine
              means patch and minor releases (a 0.x package stays within its minor);
              aggressive means the newest releases, including major versions. Cover every
              ecosystem and every workspace or sub-project in the repository, following
              the dependency guidance for each. Do not change toolchain versions (mise,
              .tool-versions, version files), Dockerfile base images or
              .apptown/app.yaml. Change application code only where a moved package
              needs it, as little as possible. Take stable releases only, never a
              pre-release (alpha, beta, rc, dev, canary), including packages the update
              pulls in indirectly. When a newer version of a package needs a
              pre-release, hold that package at the newest version that does not. Pin an
              indirect package with overrides or resolutions only where that is the
              ecosystem's normal way, and say so in the commit message. Run each part's
              declared tests, then commit. If nothing can move within the level, change
              nothing.
      steps:
        - name: repair
          uses: agent/pi
          with:
            repairRounds: 2
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: Make the failing check pass within this change’s intent. Write the code this update needs and run its checks. Never widen the change.
        - name: routine
          uses: routine
          with:
            rubric: |
              Judge whether this change is a dependency update within its approved level.
              AppTown's facts below name the level, any security findings it must fix,
              and how each changed file is classified; read the complete diff, including
              dependency files. Pass only when all of these hold. (1) Every version change
              in manifests and lockfiles stays within the level: at routine, patch and
              minor releases only, and a 0.x package stays within its minor; at
              aggressive, any newer release including majors. Never a downgrade, never a
              new registry or source, never a pre-release, including indirect packages in
              lockfiles. (2) No new direct dependency, unless it replaces one the update
              removed or renamed. (3) Every change outside dependency files is the
              smallest change a moved package needs: a renamed API, a changed import, a
              configuration key the new version requires. (4) Nothing else changes: no
              features, refactors, formatting, unrelated fixes, weakened or removed
              tests, toolchain or runtime changes. Fail when any change falls outside
              these, and name it. Answer unclear when you cannot tell whether a code
              change is needed by a moved package.
        - name: tests
          uses: tests
        - name: boot
          uses: preview
        - name: scan-source
          uses: scan
          with: {on: source}
        - name: scan-image
          uses: scan
          with: {on: image}
        - name: accept
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: I accept this dependency update and its application repairs after checking the evidence.
            standing:
              class: routine-update
              means: An AI model judged the dependency update within the selected level and limited to dependencies and the code they need, AppTown saw toolchain versions and base images unchanged, and every required check is met.
