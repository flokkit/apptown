apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: janitor-update
  title: Dependency updates
  tier: core
  category: maintenance
  description: An agent updates dependencies; AppTown checks the result.
spec:
  kind: pipeline
  role: working
  on:
    schedule: {cron: "0 6 * * 1", aggressiveCron: "0 6 * * *", queue: updates, standing: true}
  stages:
    - name: update
      onEnter:
        - name: update
          uses: agent/pi
          with:
            timeoutMinutes: 45
            docker: true
            needs: true
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: |
              Update this project's dependencies at level ${{inputs.level}}: routine
              means patch and minor releases (a 0.x package stays within its minor);
              aggressive means the newest releases, including major versions. Cover every
              ecosystem and every workspace or sub-project in the repository, following
              the dependency guidance for each. Base image updates: ${{inputs.baseImages}}.
              When false, leave every FROM and staticServer unchanged. When true, use
              apptown image newest for each external FROM and staticServer, as the
              janitor skill says: use the longest agreeing numeric toolchain declaration
              with --scope line, including when the current tag is shorter than the
              declaration; otherwise use the selected level’s scope. Choose its
              printed tag and digest; on refusal leave that
              image unchanged and report why. Do not change toolchain versions
              (mise, .tool-versions, version files). The only permitted change in
              .apptown/app.yaml is moving an existing staticServer, as the janitor skill says. Change application code only where a moved package
              needs it, as little as possible. Direct dependencies take stable releases
              only, never a pre-release (alpha, beta, rc, dev, canary). An indirect
              package may be a pre-release when a stable direct dependency's own
              declared range requires it; do not hold a direct dependency back for that.
              Pin an indirect package with overrides or resolutions only where that is
              the ecosystem's normal way, never to a pre-release, and say so in the
              commit message. Run each part's
              declared tests, then commit. If nothing can move within the level, change
              nothing. Your final message is what AppTown judges; write no report file.
              Everything AppTown judges goes in the final message. When nothing can move,
              start it with one sentence saying why, naming the image or package (for example
              "Waiting for a newer python:3.12-slim build: the newest build still has CVE-…").
              For every part that declares dependencies, give the command you ran to list
              newer releases and the lines of its output that show the result; for every
              external FROM and staticServer, give the resolver answer, its reading time
              and any stale warning or refusal. `scratch`, stage names and operands
              containing `$` need no listing. A part with no manifest or image input
              needs no listing. Say when a command could not run.
      steps:
        - name: repair
          uses: agent/pi
          with:
            timeoutMinutes: 45
            docker: true
            needs: true
            repairRounds: 2
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: Make the failing check pass within this change’s intent. Write the code this update needs and run its checks. Never widen the change.
        - name: routine
          uses: routine
          with:
            rubric: |
              Judge whether this change is a dependency update within its approved level.
              AppTown's facts below name the level, any security findings it must fix,
              and how each changed file is classified; read the complete diff, including
              dependency files. Pass only when all of these hold. (1) Every version change
              in manifests and lockfiles stays within the level: at routine, patch and
              minor releases only, and a 0.x package stays within its minor; at
              aggressive, any newer release including majors. Never a downgrade, never a
              new registry or source, never a pre-release for a direct dependency or one
              pinned by an override or resolution. An indirect package in a lockfile
              may be a pre-release when a stable direct dependency's declared range
              requires it. (2) No new direct dependency, unless it replaces one the update
              removed or renamed. (3) Except for the image and toolchain moves below, every change
              outside dependency files is the
              smallest change a moved package needs: a renamed API, a changed import, a
              configuration key the new version requires. (4) Nothing else changes: no
              features, refactors, formatting, unrelated fixes, weakened or removed
              tests or .apptown/app.yaml changes except staticServer. AppTown checks
              moved FROM and staticServer images against its registry resolver, keeping
              the same repository and variant, staying on the declared line (or the
              selected level’s scope without an agreeing numeric declaration),
              never downgrading, and proving the candidate tag’s digest with a
              registry HEAD. Any real build on that line is allowed. The agent
              reports resolver refusals and stale readings. Toolchain versions stay
              unchanged. Fail when any change falls outside
              these, and name it. When you fail, your first sentence says in plain
              words what the change does and why that needs a person (for example:
              "Restructures the Dockerfile's build stage; your settings allow only
              image version changes."); details and citations follow. Answer unclear when
              you cannot tell whether a code change is needed by a moved package. When the change is empty, pass when
              the agent's final message gives, for every part that declares dependencies
              and every image input, the command it ran and the output lines showing
              nothing can move within the level. `scratch`, a stage name and an operand
              containing `$` never move and need nothing; a part with no manifest or
              Dockerfile needs nothing (read the tree). Fail when the message shows
              something that could move within the level was left, or that a listing it
              needed could not run. A reference to a file is not a report.
        - name: tests
          uses: tests
        - name: boot
          uses: preview
        - name: scan-source
          uses: scan
          with: {on: source}
        - name: scan-image
          uses: scan
          with: {on: image}
        - name: accept
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: I accept this dependency update and its application repairs after checking the evidence.
            standing:
              class: routine-update
              means: An AI model judged the dependency update within the selected level and limited to dependencies and the code they need, AppTown saw no change outside dependencies and base-image versions of the same image and variant (and, for a security fix, toolchain patch releases), and every required check is met.
