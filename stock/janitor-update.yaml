apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: janitor-update
  title: Dependency updates
  tier: core
  category: maintenance
  description: An agent updates dependencies; AppTown checks the result.
spec:
  kind: pipeline
  role: working
  on:
    schedule: {cron: "0 6 * * 1", aggressiveCron: "0 6 * * *", queue: updates, standing: true}
  stages:
    - name: update
      onEnter:
        - name: update
          uses: agent/pi
          with:
            timeoutMinutes: 45
            docker: true
            needs: true
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: |
              Update this project's dependencies at level ${{inputs.level}}: routine
              means patch and minor releases (a 0.x package stays within its minor);
              aggressive means the newest releases, including major versions. Cover every
              ecosystem and every workspace or sub-project in the repository, following
              the dependency guidance for each. Base image updates: ${{inputs.baseImages}}.
              When false, leave every FROM and staticServer unchanged. When true, move
              each external FROM and staticServer as the janitor skill says.
              Toolchain patches: ${{inputs.toolchainPatches}}. When false, do not change
              toolchain versions (mise, .tool-versions, version files, go.mod's toolchain
              line); when true, move them only as the janitor skill says. The only permitted change in
              .apptown/app.yaml is moving an existing staticServer, as the janitor skill says. Change application code only where a moved package
              needs it, as little as possible. Direct dependencies take stable releases
              only, never a pre-release (alpha, beta, rc, dev, canary). An indirect
              package may be a pre-release when a stable direct dependency's own
              declared range requires it; do not hold a direct dependency back for that.
              Pin an indirect package with overrides or resolutions only where that is
              the ecosystem's normal way, never to a pre-release, and say so in the
              commit message. Run each part's
              declared tests. Update everything you can within the level, then
              commit; if nothing can move, change nothing. Your final message is a note for the people who read this change; AppTown judges
              the change, its tests, its start-up and its own scans. If you leave
              anything that could move within the level, say in one line each what
              and why (for example "Waiting for a newer python:3.12-slim build: the
              newest build still has CVE-…"). Otherwise no explanation is needed.
              Write no report file.
      steps:
        - name: repair
          uses: agent/pi
          with:
            timeoutMinutes: 45
            docker: true
            needs: true
            repairRounds: 2
            mayChangeNothing: true
            skills: [skill/janitor]
            prompt: Make the failing check pass within this change’s intent. Write the code this update needs and run its checks. Never widen the change.
        - name: routine
          uses: routine
          with:
            rubric: |
              Judge whether this change is a dependency update within its approved level.
              AppTown's facts below name the level, any security findings it must fix,
              and how each changed file is classified; read the complete diff, including
              dependency files. Pass only when all of these hold. (1) Every version change
              in manifests and lockfiles stays within the level: at routine, patch and
              minor releases only, and a 0.x package stays within its minor; at
              aggressive, any newer release including majors. Never a downgrade, never a
              new registry or source, never an override or resolution that pins a
              pre-release. AppTown itself checks npm, uv, Go module and Bundler
              projects for direct dependencies that are pre-releases: leave their
              other pre-release versions to it. With any other package manager, a
              direct dependency never moves to a pre-release. (2) No new direct dependency, unless it replaces one the update
              removed or renamed. (3) Except for the image moves below, every change
              outside dependency files is the
              smallest change a moved package needs: a renamed API, a changed import, a
              configuration key the new version requires. (4) Nothing else changes: no
              features, refactors, formatting, unrelated fixes, weakened or removed
              tests or .apptown/app.yaml changes except staticServer. Lines added to
              PROJECT-NOTES.md are allowed.
              AppTown has already checked every moved FROM and staticServer image
              against its registry, the declared line and the level; do not judge
              those image lines. A FROM tag that names a toolchain (golang, node,
              python) is such an image move, not a toolchain change. Toolchain
              versions stay unchanged, including toolchain declarations in manifests
              such as go.mod, except, when the facts say toolchain patches are on, a
              patch release within the same minor.
              Fail when any change falls outside
              these, and name it. When you fail, your first sentence says in plain
              words what the change does and why that needs a person (for example:
              "Restructures the Dockerfile's build stage; your settings allow only
              image version changes."); details and citations follow. Answer unclear when
              you cannot tell whether a code change is needed by a moved package.
        - name: stable-direct-node
          uses: scan
          with: {scanner: npm-direct-prereleases}
        - name: stable-direct-python
          uses: scan
          with: {scanner: uv-direct-prereleases}
        - name: stable-direct-go
          uses: scan
          with: {scanner: go-direct-prereleases}
        - name: stable-direct-ruby
          uses: scan
          with: {scanner: bundle-direct-prereleases}
        - name: tests
          uses: tests
        - name: boot
          uses: preview
        - name: scan-source
          uses: scan
          with: {on: source}
        - name: scan-image
          uses: scan
          with: {on: image}
        - name: accept
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: I accept this dependency update and its application repairs after checking the evidence.
            standing:
              class: routine-update
              means: An AI model judged the dependency update within the selected level and limited to dependencies and the code they need, AppTown saw no change outside dependencies and base-image versions of the same image and variant (and, with toolchain patches on, toolchain patch releases within the same minor), and every required check is met.
