apiVersion: apptown.dev/v1
kind: Workflow
metadata:
  name: rebuild
  system: true
  description: Build a new release image from a recorded commit to refresh packages or replace a missing image.
spec:
  kind: pipeline
  role: record
  workspace: run
  stages:
    - name: build
      steps:
        - name: build
          uses: build
        - name: scan-bundle
          uses: scan
          with: {on: bundle}
      gate: {require: [build]}
