# Stock workflow: adopt-integration — when the org attaches a cross-cutting
# service to this project (SSO, error tracking, telemetry, …), this lane
# wires the product into it. The generated steering already says exactly how
# — the agent's job is to follow it, minimally, and prove the app still runs.
apiVersion: forge.flokkit.io/v1
kind: Workflow
metadata:
  name: adopt-integration
  system: true
  category: integration
  description: >-
    Connect the app to a newly attached integration, following the integration's guidance, and check that it builds and runs both with and without the integration configured.
spec:
  kind: lifecycle
  role: working
  workspace: project
  defaults:
    thinking: medium
  stages:
    - name: wire
      onEnter:
        - name: wire-integration
          uses: agent/pi
          with:
            skills: [skill/implementation]
            docker: true
            needs: true # the app contract's declared needs run as emulators + env
            output: { kind: adopt-report, name: adopt-report, file: .forge/ADOPT.md }
            timeoutMinutes: 25
            prompt: |
              This project has been attached to an organisational service —
              the Change below names it. Your steering contains an
              "(attached, generated)" section for that service describing
              exactly how products wire it: which env vars are injected and
              what the code must do with them. Follow it precisely.

              Rules:
              - Minimal wiring: initialise the SDK/config from the injected
                env vars; never hardcode endpoints, DSNs, or names.
              - The app must still run cleanly when the service's env vars
                are absent (local dev).
              - A static site (a `static:` part in .forge/app.yaml) cannot
                read env vars: load /_forge/env.js as the first script in
                the page's <head>, exactly as guidance
                deploy/browser-values shows, and read the values from
                window.__FORGE_ENV__ (guidance
                deploy/browser-values). Only values marked safe for
                browsers are there; never put a secret in a page.
              - Verify both modes with your bash tool: build, tests, run
                with the env unset, run with representative env set.
              - If a reviewer previously rejected this work, their feedback:
                ${{feedback.latest}}

              WRITE .forge/ADOPT.md: what was wired, files
              changed and why, how both modes were verified. Chat output is
              not captured. Do not commit the report: the forge collects it
              from the workspace, and .forge/ is ignored.

              --- CHANGE ---

              ${{change.body}}
        - name: boot
          uses: preview
      steps:
        - name: report-exists
          uses: artifact/require
          with: { kind: adopt-report }
        # Judged against the booted preview: a static page given values must
        # load them (a static app once adopted error reporting that could
        # never report, 29 September 2026).
        - name: guidance-conformance
          uses: guidance/conformance
        - name: review-wiring
          uses: agent/review
          with:
            model: review
            of: adopt-report
            prompt: >-
              Check the diff for hardcoded endpoints/DSNs/secrets (fail if
              any), confirm env-absent behaviour is genuinely a no-op, and
              that the wiring matches what the report claims.
        - name: accept
          uses: approval
          with:
            approvers: ["role:project-approver"]
            means: "I confirmed the wiring matches the report, and this integration is one we want to depend on."
            instructions: "Read the adopt report and the diff. To send it back, reject with a comment."
