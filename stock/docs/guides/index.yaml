# The Docs page's groups and reading order. Each group lists guide slugs
# (file names without .md) in the order a reader should take them; the page
# opens on the first guide of the first group.
#
# A guide on disk that no group names is still shown, under "Other", so a new
# guide is never hidden. A slug here with no guide on disk is skipped; the
# httpapi docs tests fail on such a slug unless it is a guide being written.
groups:
  - title: Start here
    guides:
      - quickstart
      - what-apptown-is-for
  - title: Building on AppTown
    guides:
      - changes-and-main
      - connect-a-coding-agent
      - how-apps-run
      - runtime-environments
      - services-and-data
      - wordpress
      - secrets
      - container-lifecycle
      - toolchains
      - contract-reference
      - ways-of-working-formats
      - conformance
  - title: Running AppTown
    guides:
      - setups
      - running-apptown
      - platforms
      - trial
      - server-setup
      - split-install
      - deployment-targets
      - people-and-roles
      - apptown-backups
      - deployment-backups
      - upgrading
      - packs-and-what-if
      - monitoring
      - compatibility
      - cli-json
  - title: How AppTown works
    guides:
      - architecture
      - the-change
      - glossary
