# AppTown's container images, on a release tag (design/operations/github.md):
#   ghcr.io/flokkit/apptown         AppTown server (deploy/Dockerfile, target server)
#   ghcr.io/flokkit/apptown-worker  the worker (deploy/Dockerfile, target worker)
#   ghcr.io/flokkit/apptown-agent   the agent image (deploy/apptown-agent)
# the release archives on a GitHub Release (the archives job below), and the
# UI tour, published with apptown.dev (the tour and site jobs).
#
# Every tag pushes: each image is pushed by digest with BuildKit's provenance
# (mode=max) and SBOM, and joined into one tag per version. PUBLIC (below)
# follows the repository's visibility and decides the rest:
# Each image is built natively on amd64 and arm64 runners in both cases
# (arm64 runners are free for public repositories and billed by the minute
# for private ones).
# - private: into private GHCR packages (billed beyond the free allowance),
#   and not signed.
# - public: signed keyless with cosign (GitHub's OIDC token; the signature is recorded in Sigstore's
#   public log with the repository's name, which is why a private repository
#   does not sign).
name: images

on:
  push:
    tags: ["v*"]

env:
  PUBLIC: ${{ github.event.repository.visibility == 'public' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Images and archives are built only for a commit the heavy tiers passed
  # on first time: a heavy.yml run on main or by hand on the tag's commit
  # whose first attempt succeeded (scripts/heavy-evidence.py). A run that
  # passed only on a re-run, no run, a red one, or a lookup that fails is not
  # evidence, and nothing is built. Fix the cause in a new commit, or start a
  # new heavy.yml run by hand on the commit, then re-run this workflow.
  heavy-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/heavy-evidence.py "$GITHUB_REPOSITORY" "$GITHUB_SHA"

  build:
    needs: heavy-evidence
    name: build ${{ matrix.image.name }} ${{ matrix.platform.slug }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: apptown, context: ., file: deploy/Dockerfile, target: server }
          - { name: apptown-worker, context: ., file: deploy/Dockerfile, target: worker }
          - { name: apptown-agent, context: deploy/apptown-agent, file: deploy/apptown-agent/Dockerfile, target: "" }
        platform:
          - { platform: linux/amd64, slug: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, slug: arm64, runner: ubuntu-24.04-arm }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # "--" ends the image's name: digests-apptown-* would also match
          # apptown-agent's and apptown-worker's digests.
          name: digests-${{ matrix.image.name }}--${{ matrix.platform.slug }}
          path: digests/*
          retention-days: 1

  # One tag per version from the per-platform digests; signed when public.
  merge:
    name: merge and sign ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: [apptown, apptown-worker, apptown-agent]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.name }}--*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.0.0; and for a release that is not a pre-release, 1.0 and latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - working-directory: digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086 # one argument per tag and digest
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
      - id: index
        run: |
          version=$(jq -r '.labels["org.opencontainers.image.version"]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - if: env.PUBLIC == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - if: env.PUBLIC == 'true'
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # The release archives (scripts/release-archives.sh owns their names and
  # contents) and SHA256SUMS, on a GitHub Release for the tag: a test tag's
  # release is a draft, a tag with a "-" (an rc) a prerelease, a plain tag a
  # release marked latest. SUMS is signed keyless when public, as the images
  # are. The notes are releases/<tag>.md when the repository has them.
  archives:
    name: release archives
    needs: heavy-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sh scripts/release-archives.sh "${TAG#v}" "$GITHUB_SHA" dist
      - if: env.PUBLIC == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - if: env.PUBLIC == 'true'
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - run: |
          case $TAG in
            *-test.*) kind=--draft ;;
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          notes=releases/$TAG.md
          [ -f "$notes" ] || { notes=$(mktemp); echo "AppTown $TAG" >"$notes"; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun: replace the files (each is deleted before its
            # replacement goes up). gh release create drafts while it
            # uploads and publishes at the end, so a cancelled first run
            # can leave a draft; that is not a published release.
            gh release upload "$TAG" dist/* --clobber
            if [ "$kind" != --draft ] && [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ]; then
              echo "::error::$TAG is still a draft: publish it by hand (gh release edit $TAG --draft=false)"
              exit 1
            fi
          else
            gh release create "$TAG" dist/* "$kind" --verify-tag --title "AppTown $TAG" --notes-file "$notes"
          fi

  # The UI tour (site/tour): make tour in the ci-heavy image
  # (scripts/ci-heavy.sh tour), from the tag's own source, once the images
  # exist. Its screenshots and page are this run's tour artifact, which the
  # site job publishes; a test tag keeps the artifact and publishes nothing.
  # make tour ends by checking every shot, so a failed or incomplete tour
  # fails here and the site is not published.
  tour:
    name: the UI tour
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_HEAVY_ID: ${{ github.run_id }}-${{ github.run_attempt }}-tour
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/ci-heavy.sh tour
      - if: always()
        run: sh scripts/ci-heavy.sh cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tour
          path: |
            site/tour/*.png
            site/tour/index.html
          if-no-files-found: error
          retention-days: 30

  # apptown.dev's try script starts the version just published, so the site
  # is published only once every image is merged, and with this run's tour.
  # A test tag (-test.N) builds and publishes images but leaves the public
  # site alone. The job runs in the
  # apptown.dev environment, which only v* tags may deploy to; GitHub's OIDC
  # token for that environment signs in to AWS as apptown-site-publisher
  # (tf/products/apptown/site in the maintainers' infrastructure repository),
  # which trusts that environment alone and may only write the site bucket and
  # invalidate its distribution.
  site:
    name: publish apptown.dev
    needs: [merge, tour]
    if: ${{ !contains(github.ref_name, '-test.') }}
    runs-on: ubuntu-24.04
    environment: apptown.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tour
          path: site/tour/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::078142186677:role/apptown-site-publisher
          aws-region: us-east-1
      - run: sh site/publish.sh "${GITHUB_REF_NAME#v}"
