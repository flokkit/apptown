# The forge's container images, on a release tag (design/operations/github.md):
#   ghcr.io/flokkit/apptown         the forge server (deploy/Dockerfile, target server)
#   ghcr.io/flokkit/apptown-worker  the worker (deploy/Dockerfile, target worker)
#   ghcr.io/flokkit/apptown-agent   the agent image (deploy/forge-agent)
#
# PUBLISH (below) decides the mode. It follows the repository's visibility;
# set it to true or false to override.
# - false (private): each image is built for linux/amd64 only and not pushed,
#   so nothing is stored in GHCR; the run proves the images build at the tag.
# - true (public): each image is built natively on amd64 and arm64 runners,
#   pushed by digest with BuildKit's provenance (mode=max) and SBOM, joined
#   into one multi-platform tag per version, and signed keyless with cosign
#   (GitHub's OIDC token; the signature is recorded in Sigstore's public log,
#   which is why a private repository does not sign).
name: images

on:
  push:
    tags: ["v*"]

env:
  PUBLISH: ${{ github.event.repository.visibility == 'public' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      platforms: ${{ steps.mode.outputs.platforms }}
    steps:
      - id: mode
        run: |
          if [ "$PUBLISH" = true ]; then
            echo publish=true >> "$GITHUB_OUTPUT"
            echo 'platforms=[{"platform":"linux/amd64","slug":"amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","slug":"arm64","runner":"ubuntu-24.04-arm"}]' >> "$GITHUB_OUTPUT"
          else
            echo publish=false >> "$GITHUB_OUTPUT"
            echo 'platforms=[{"platform":"linux/amd64","slug":"amd64","runner":"ubuntu-24.04"}]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.image.name }} ${{ matrix.platform.slug }}
    needs: plan
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: apptown, context: ., file: deploy/Dockerfile, target: server }
          - { name: apptown-worker, context: ., file: deploy/Dockerfile, target: worker }
          - { name: apptown-agent, context: deploy/forge-agent, file: deploy/forge-agent/Dockerfile, target: "" }
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}
      - if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.slug }}
          path: digests/*
          retention-days: 1

  # One multi-platform tag per version from the per-platform digests, signed.
  merge:
    name: merge and sign ${{ matrix.name }}
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: [apptown, apptown-worker, apptown-agent]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.name }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.0.0; and for a release that is not a pre-release, 1.0 and latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - working-directory: digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086 # one argument per tag and digest
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
      - id: index
        run: |
          version=$(jq -r '.labels["org.opencontainers.image.version"]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
