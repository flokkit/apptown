# The heavy tiers (design/architecture/testing.md): the Docker integration
# tier, the journeys, the opt-in browser, pi and inference_docker tiers, and
# the race detector.
#
# They run on every pull request to main, once per pushed commit, and on
# every push to main, so each landed commit gets its own result; any branch
# can be run by hand. A release tag's images are built only for a commit
# with a run that passed on its first attempt (images.yml, heavy-evidence).
# The main ruleset requires heavy-ok, so a red run blocks merging. No label
# changes what runs.
#
# integration, journeys and opt-in-tiers run go test as root in the
# apptown-ci-heavy image beside the runner's Docker daemon
# (scripts/ci-heavy.sh, deploy/ci-heavy/Dockerfile); race runs on the runner
# as its ordinary user, as make check does, because root reads files whatever
# their mode and the permission-refusal tests would fail.
name: heavy

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pull request's newer run replaces its older one. Main's runs are each
# kept: every landed commit needs its own result.
concurrency:
  group: heavy-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  GOFLAGS: -buildvcs=false

defaults:
  run:
    shell: bash

jobs:
  qualification-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: report qualification inputs (all tests still execute)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || '' }}
        run: python3 scripts/heavy-qualification.py --repository "$GITHUB_REPOSITORY" --base "$BASE_SHA" --candidate "$GITHUB_SHA" --output heavy-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heavy-qualification
          path: heavy-qualification.json
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx vite build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1
          include-hidden-files: true

  tier:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integration-root
            args: test-partition integration root
            require: ""
          - name: integration-dependency
            args: test-partition integration dependency
            require: ""
          - name: integration-worker
            args: test-partition integration worker
            require: ""
          - name: integration-rest
            args: test-partition integration rest
            require: ""
          # The era-upgrade suite is not part of this run: it was retired
          # with the SQLite format (design/architecture/testing-map.md §5).
          - name: journeys
            args: test -tags=journey ./internal/apptown/ -run TestJourney -count=1 -timeout 30m -v
            require: ""
          # The test image carries Playwright's Chromium and the pinned Pi.
          # A skip is not evidence: the job fails unless each test passed.
          # One package at a time (-p 1): Chromium runs on the host network,
          # and a container the console test starts adds a host interface,
          # which aborts a navigation in flight (ERR_NETWORK_CHANGED).
          - name: opt-in-tiers
            args: test -tags=browser,pi,inference_docker -p 1 ./internal/apptown/ ./internal/console/pi/ -run '^(TestBrowserSecurityChromium|TestInferencePinnedPi|TestInferenceConsoleMountBoundary)$' -count=1 -timeout 20m -v
            require: TestBrowserSecurityChromium TestInferencePinnedPi TestInferenceConsoleMountBoundary
    name: ${{ matrix.name }}
    env:
      CI_HEAVY_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
      CI_HEAVY_REQUIRE: ${{ matrix.require }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/
      - name: configure host compilation caches
        run: |
          echo "CI_HEAVY_GOMOD=$HOME/go/pkg/mod" >> "$GITHUB_ENV"
          echo "CI_HEAVY_GOCACHE=$HOME/.cache/go-build" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gobuild
        with:
          path: ~/.cache/go-build
          key: go-build-heavy-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'deploy/ci-heavy/Dockerfile') }}-${{ github.sha }}
          restore-keys: go-build-heavy-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'deploy/ci-heavy/Dockerfile') }}-
      # The tests' images (deploy/ci-heavy/test-images.txt), before the
      # tests: a registry error fails this step, not a test.
      - name: pull test images
        run: sh scripts/ci-heavy.sh pull
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: runner image inputs
        id: image-inputs
        run: echo "pi=$(sed -n 's/^ARG PI_VERSION=//p' deploy/apptown-agent/Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: build agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/apptown-agent
          load: true
          tags: apptown-agent
          cache-from: type=gha,version=2,scope=ci-heavy-agent-linux-amd64
          cache-to: ${{ github.ref == 'refs/heads/main' && matrix.name == 'integration-root' && 'type=gha,version=2,scope=ci-heavy-agent-linux-amd64,mode=min' || '' }}
      - name: build test runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/ci-heavy
          file: deploy/ci-heavy/Dockerfile
          build-args: PI_VERSION=${{ steps.image-inputs.outputs.pi }}
          load: true
          tags: apptown-ci-heavy
          cache-from: type=gha,version=2,scope=ci-heavy-runner-linux-amd64
          cache-to: ${{ github.ref == 'refs/heads/main' && matrix.name == 'integration-root' && 'type=gha,version=2,scope=ci-heavy-runner-linux-amd64,mode=min' || '' }}
      - name: go test (${{ matrix.name }})
        env:
          CI_HEAVY_PREBUILT: "1"
        run: eval "sh scripts/ci-heavy.sh ${{ matrix.args }}"
      - if: always()
        run: sh scripts/ci-heavy.sh cleanup

      - if: github.ref == 'refs/heads/main' && steps.gobuild.outputs.cache-hit != 'true'
        run: python3 scripts/ci-cache-trim.py ~/.cache/go-build --max-mib 256
      - if: github.ref == 'refs/heads/main' && steps.gobuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gobuild.outputs.cache-primary-key }}

  race:
    strategy:
      fail-fast: false
      matrix:
        group: [root, backup, workflow, rest]
    name: race-${{ matrix.group }}
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/
      # Go's module and build caches: restored by prefix from main's, saved
      # only on main (as in ci.yml); each successful commit refreshes compilation. ci.yml's
      # checks job saves the modules.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gomod
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gobuild
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-build-race-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: pull test images
        run: sh scripts/ci-heavy.sh pull
      - run: sh scripts/ci-test-partition.sh race "${{ matrix.group }}"
      - if: github.ref == 'refs/heads/main' && steps.gobuild.outputs.cache-hit != 'true'
        run: python3 scripts/ci-cache-trim.py ~/.cache/go-build --max-mib 256
      - if: github.ref == 'refs/heads/main' && steps.gobuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gobuild.outputs.cache-primary-key }}

  # A check the main ruleset requires, beside ci.yml's ci-ok: it passes only
  # when every job above succeeded, so a job added or renamed here (or a
  # matrix entry) cannot drop out of what a merge needs. It runs even when a
  # job failed or was skipped, and then fails: skipped is not passed.
  heavy-ok:
    if: always()
    needs: [qualification-report, web, tier, race]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job did not succeed ($r)"; exit 1; }; done
