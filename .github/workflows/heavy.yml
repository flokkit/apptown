# The heavy tiers (design/architecture/testing.md): the Docker integration
# tier, the journeys, the opt-in browser, pi and inference_docker tiers, and
# the race detector.
#
# They execute on the merge queue unless narrow documentation reuse qualifies,
# and always on manual dispatch. PRs report admission only. Go's test cache
# reuses results that main's fresh runs stored (heavy-main.yml) for packages
# whose inputs are unchanged (ci-test-environment.sh, ci-test-partition.sh),
# so a run here can be partly cached: it is queue qualification, not release
# evidence. A release candidate needs a heavy-main.yml run (candidate.yml,
# identity).
# The main ruleset requires heavy-ok, so a red run blocks merging. No label
# changes what runs.
#
# integration, journeys and opt-in-tiers run go test as root in the
# apptown-ci-heavy image beside the runner's Docker daemon
# (scripts/ci-heavy.sh, deploy/ci-heavy/Dockerfile); race runs on the runner
# as its ordinary user, as make check does, because root reads files whatever
# their mode and the permission-refusal tests would fail.
name: heavy

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pull request's newer run replaces its older admission run. Queue and
# manual runs are kept by commit for exact-SHA execution evidence.
concurrency:
  group: heavy-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  GOFLAGS: -buildvcs=false

defaults:
  run:
    shell: bash

jobs:
  qualification-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.qualification.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: qualify heavy inputs
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || '' }}
        run: python3 scripts/heavy-qualification.py --repository "$GITHUB_REPOSITORY" --base "$BASE_SHA" --candidate "$GITHUB_SHA" --output heavy-qualification.json --event "$GITHUB_EVENT_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heavy-qualification
          path: heavy-qualification.json
          retention-days: 7

  web:
    needs: qualification-report
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'merge_group' && needs.qualification-report.outputs.decision == 'execute')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx vite build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1
          include-hidden-files: true

  tier:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'merge_group' && needs.qualification-report.outputs.decision == 'execute')
    needs: [qualification-report, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integration-root-a
            args: test-partition integration root-a
            require: ""
          - name: integration-root-b
            args: test-partition integration root-b
            require: ""
          - name: integration-root-c
            args: test-partition integration root-c
            require: ""
          - name: integration-dependency
            args: test-partition integration dependency
            require: ""
          - name: integration-worker
            args: test-partition integration worker
            require: ""
          - name: integration-rest
            args: test-partition integration rest
            require: ""
          # The era-upgrade suite is not part of this run: it was retired
          # with the SQLite format (design/architecture/testing-map.md §5).
          - name: journeys
            args: test -tags=journey ./internal/apptown/ -run TestJourney -timeout 30m -v
            require: ""
          # The test image carries Playwright's Chromium and the pinned Pi.
          # A skip is not evidence: the job fails unless each test passed.
          # One package at a time (-p 1): Chromium runs on the host network,
          # and a container the console test starts adds a host interface,
          # which aborts a navigation in flight (ERR_NETWORK_CHANGED).
          - name: opt-in-tiers
            args: test -tags=browser,pi,inference_docker -p 1 ./internal/apptown/ ./internal/console/pi/ -run '^(TestBrowserSecurityChromium|TestInferencePinnedPi|TestInferenceConsoleMountBoundary)$' -timeout 20m -v
            require: TestBrowserSecurityChromium TestInferencePinnedPi TestInferenceConsoleMountBoundary
    name: ${{ matrix.name }}
    # The job's name is its ID: the runner is this job's alone, and the
    # tests' temporary folder (TMPDIR, which they read) is then the same in
    # every run, so it does not stop Go's test cache from matching.
    env:
      CI_HEAVY_ID: ${{ matrix.name }}
      CI_HEAVY_REQUIRE: ${{ matrix.require }}
      CI_TEST_RESULTS: reuse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/
      # Every file's time from its content, so equal content is equal to
      # Go's test cache in every run (scripts/ci-content-mtimes.py).
      - run: python3 scripts/ci-content-mtimes.py .
      - name: configure host compilation caches
        run: |
          echo "CI_HEAVY_GOMOD=$HOME/go/pkg/mod" >> "$GITHUB_ENV"
          echo "CI_HEAVY_GOCACHE=$HOME/.cache/go-build" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gobuild
        with:
          path: ~/.cache/go-build
          key: go-build-heavy-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'deploy/ci-heavy/Dockerfile') }}-${{ github.sha }}
          restore-keys: go-build-heavy-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'deploy/ci-heavy/Dockerfile') }}-
      # The runner image's preinstalled SDKs (.NET, Android, Haskell,
      # CodeQL, Swift) take about 30 GB that no job here uses; without
      # them the test images, the two built images and their layers ran
      # out of disk (31 Oct, twice). Removing them takes seconds.
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      # The tests' images (deploy/ci-heavy/test-images.txt), before the
      # tests: a registry error fails this step, not a test.
      - name: pull test images
        run: sh scripts/ci-heavy.sh pull
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: runner image inputs
        id: image-inputs
        run: echo "pi=$(sed -n 's/^ARG PI_VERSION=//p' deploy/apptown-agent/Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: build agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/apptown-agent
          load: true
          tags: apptown-agent
          cache-from: type=gha,version=2,scope=ci-heavy-agent-linux-amd64
      - name: build test runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/ci-heavy
          file: deploy/ci-heavy/Dockerfile
          build-args: PI_VERSION=${{ steps.image-inputs.outputs.pi }}
          load: true
          tags: apptown-ci-heavy
          cache-from: type=gha,version=2,scope=ci-heavy-runner-linux-amd64
      - name: go test (${{ matrix.name }})
        env:
          CI_HEAVY_PREBUILT: "1"
        run: eval "sh scripts/ci-heavy.sh ${{ matrix.args }}"
      - if: always()
        run: sh scripts/ci-heavy.sh cleanup

  race:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'merge_group' && needs.qualification-report.outputs.decision == 'execute')
    strategy:
      fail-fast: false
      matrix:
        group: [root, backup, workflow, rest]
    name: race-${{ matrix.group }}
    needs: [qualification-report, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/
      - run: python3 scripts/ci-content-mtimes.py .
      # Go's module and build caches, with main's stored test results:
      # restored by prefix from heavy-main.yml's, which alone saves them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gomod
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gobuild
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-build-race-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: pull test images
        run: sh scripts/ci-heavy.sh pull
      - run: sh scripts/ci-test-environment.sh reuse
      - run: sh scripts/ci-test-partition.sh race "${{ matrix.group }}"

  # A check the main ruleset requires, beside ci.yml's ci-ok: it passes only
  # when execution succeeds or explicit queue reuse skips every execution
  # group. PR admission and manual full execution have separate contracts.
  heavy-ok:
    if: always()
    needs: [qualification-report, web, tier, race]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          DECISION: ${{ needs.qualification-report.outputs.decision }}
          REPORT_RESULT: ${{ needs.qualification-report.result }}
          RESULTS: ${{ format('{0} {1} {2}', needs.web.result, needs.tier.result, needs.race.result) }}
        run: sh scripts/heavy-result.sh
