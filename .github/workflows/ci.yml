# The required checks of every pull request (design/operations/github.md).
#
# What runs: make check's web stages, its docs checks, its Go checker
# stages (three jobs), the public gate, the SQL-write rule and the Go unit
# tests, split four ways by package. Docker integration, journeys, opt-in tiers
# and race run in heavy-main.yml after merge and by hand. The tests' PostgreSQL
# is the harness's own disposable container (internal/dbtest), as in local checks.
name: ci

# Every pull request and queue commit runs every job, documentation-only
# changes too, so ci-ok always reports. The queue tests what main becomes.
# Main runs again because only main's caches can be restored by every pull
# request (a cache saved on a pull request is that pull request's alone).
# Each landed commit also gets its own result.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A pull request's newer run replaces its older one. Main's runs, and runs
# by hand, are each kept.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

# bash with pipefail: a failed go list fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Go embeds this artifact; frontend validation runs independently below.
  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx vite build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1
          include-hidden-files: true

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # The guides' checks: docs-links.py reads Markdown with web/'s library.
      - run: make check-docs
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      # The registry's advisory service, for web/ and the starter seeds:
      # high or critical fails, and so does a report npm could not get.
      - run: make check-npm-audit

  # The checker stages of make check-go-gate, the pin, npm install-script and build-artifact
  # checks, and govulncheck. Vet and every analyzer load web/, which embeds
  # web/dist, so this needs the web build. Three jobs, so the analyzers that
  # type-check every package do not share one runner's four cores; together
  # they run every stage once (scripts/ci_workflows_test.py), and check-gate
  # after the others in its job, alone.
  checks:
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: a
            stages: check-vet check-staticcheck check-vuln check-pins check-npm-scripts
          - group: b
            stages: check-lint check-lint-test check-shape check-ci-heavy
          - group: c
            stages: check-go-source check-exec check-container-output check-sqlnow check-reachability check-build-artifacts
    name: checks (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/
      # Go's module and build caches: restored by prefix from main's, saved
      # only on main. Compilation is refreshed per commit, restored by compatible prefix.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gomod
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gobuild
        with:
          path: ~/.cache/go-build
          key: go-build-checks-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-build-checks-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      # The analyzers the Makefile pins, by the Makefile's hash.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: make tools
      - env:
          MAKE: make
          STAGES: ${{ matrix.stages }}
        # The stage names are words; splitting them is the point.
        run: |
          # shellcheck disable=SC2086
          python3 scripts/gate.py $STAGES
      - if: matrix.group == 'b'
        run: make check-gate
      # The tools and modules are the same in every group; one saves them.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.group == 'a' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.group == 'a' && steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.gomod.outputs.cache-primary-key }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gobuild.outputs.cache-hit != 'true'
        run: python3 scripts/ci-cache-trim.py ~/.cache/go-build --max-mib 256
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gobuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gobuild.outputs.cache-primary-key }}

  # The Go unit tests, partitioned (scripts/ci-test-partition.sh unit): the
  # root package's two halves (as the gate splits it), the rest of
  # internal/apptown, and everything else. Go's test cache reuses results
  # main's fresh runs stored, for packages whose inputs are unchanged; a push
  # to main runs every test fresh and alone saves (ci-test-environment.sh).
  test:
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [root-a, root-b, subsystems, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/
      # Every file's time from its content, so equal content is equal to
      # Go's test cache in every run (scripts/ci-content-mtimes.py).
      - run: python3 scripts/ci-content-mtimes.py .
      # Go's module and build caches, with main's stored test results:
      # restored by prefix from main's, saved only by a push to main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gomod
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gobuild
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ matrix.part }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-build-test-${{ matrix.part }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      # The images the tests may start, so the environment can name them.
      - name: pull test images
        run: sh scripts/ci-heavy.sh pull
      - run: sh scripts/ci-test-environment.sh ${{ github.event_name == 'push' && 'fresh' || 'reuse' }}
      - name: go test (${{ matrix.part }})
        run: sh scripts/ci-test-partition.sh unit "${{ matrix.part }}"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gobuild.outputs.cache-hit != 'true'
        run: python3 scripts/ci-cache-trim.py ~/.cache/go-build --max-mib 256
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gobuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gobuild.outputs.cache-primary-key }}

  # The public gate (scripts/public-check.py): HEAD's tree has no private
  # path or maintainers' root file, names none of their home-lab hosts, and
  # gitleaks (pinned by version and SHA-256) finds nothing.
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks versioning=semver extractVersion=^v(?<version>.*)$
      GITLEAKS_VERSION: 8.30.1
      # renovate: checksum=gitleaks/gitleaks version=v8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check-public

  # The silent-DB-write rule (semgrep), as make precheck runs it.
  sql-writes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check-sql

  # The merge queue's required check (the main ruleset): it
  # passes only when every job above succeeded, so a job added or renamed
  # here cannot drop out of what a merge needs. It runs even when a job
  # failed or was skipped, and then fails: skipped is not passed.
  ci-ok:
    if: always()
    needs: [web-build, web, checks, test, public, sql-writes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job did not succeed ($r)"; exit 1; }; done
