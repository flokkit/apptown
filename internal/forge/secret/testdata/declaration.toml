
[project]
name = "quick-poll"
revision = "1.0"

[profiles.default]
SECRET_KEY_BASE   = { description = "signs cookies", generate = true }
STRIPE_API_KEY    = { description = "payments" }
MIGRATION_DB_ROLE = { description = "schema changes only" }
OPTIONAL_THING    = { description = "nice to have", required = false }

[profiles.preview]
STRIPE_API_KEY = { required = false }

[profiles.standalone.defaults]
inherit = false

[profiles.standalone]
ONLY_HERE = { description = "alone" }

[scopes.web]
secrets = ["SECRET_KEY_BASE", "STRIPE_API_KEY"]

[scopes.worker]
secrets = ["SECRET_KEY_BASE"]

[scopes.init-migrate]
secrets = ["MIGRATION_DB_ROLE"]

[providers]
vault = "onepassword://Production"
