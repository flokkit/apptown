# The stack each company app is built on, chosen by hand: spread across
# every supported server pack so a long-running test operates all of them,
# matched to what the app does, and rolled out a company per wave to fit the
# host's memory. The runner creates each app with this pack and still records
# AppTown's own pack suggestion beside it (the picker is measured, not used).
#
# Starting memory per backend (stock guidance, measured 13 Oct): java and
# rails 256M, django 160M, dotnet and node 128M, go and rust 48M,
# frontend-only 32M; plus the app's database where it has one. A server app
# takes server-base, its backend, postgres when it keeps records there, and a
# UI pack when it has a browser UI, comma-separated.

waves:
  - harbourline-freight
  - coldwater-shire
  - bramble-street-cu
  - marrow-finch-vets
  - tidewell-grammar

apps:
  harbourline-freight:
    dock-scheduler: { pack: server-base,rails,postgres,server-rendered, why: bookings with scheduled reminders }
    driver-hours: { pack: server-base,java,postgres, why: regulated records with a nightly check job }
    freight-claims: { pack: server-base,django,postgres,server-rendered, why: forms and photo uploads to object storage }
    fuel-reconciler: { pack: server-base,go,postgres,vite-react, why: a batch job and one report page }
    depot-directory: { pack: frontend-only, why: static content }
    website: { pack: server-base,wordpress, why: a marketing site with a contact form }
    driver-recruitment: { pack: server-base,node,postgres,vite-react, why: a campaign site with an expression-of-interest form }
  coldwater-shire:
    pothole-reports: { pack: server-base,django,postgres,server-rendered, why: a public form with photos and a staff map }
    dog-registration: { pack: server-base,rails,postgres,server-rendered, why: renewals and scheduled reminder emails }
    hall-bookings: { pack: server-base,dotnet,postgres, why: rates, bonds and refunds }
    planning-notices: { pack: frontend-only, why: a static site regenerated from data }
    meeting-papers: { pack: server-base,java,postgres, why: a document archive in object storage }
    website: { pack: server-base,wordpress, why: a council information site }
    main-street-upgrade: { pack: server-base,node,postgres,vite-react, why: a project site with a feedback form }
  bramble-street-cu:
    hardship-requests: { pack: server-base,dotnet,postgres, why: assessment rules and approvals }
    cash-orders: { pack: server-base,go,postgres,vite-react, why: a small service with two-person approval }
    complaints-register: { pack: server-base,rails,postgres,server-rendered, why: deadlines and a daily job }
    rate-sheet: { pack: frontend-only, why: static content updated with sign-off }
    website: { pack: server-base,django,postgres,server-rendered, why: an information site with pages staff edit }
    first-home: { pack: server-base,node,postgres,vite-react, why: a calculator and an enquiry form }
  marrow-finch-vets:
    vaccine-stock: { pack: server-base,dotnet,postgres, why: stock, expiry and reorder rules }
    referral-tracker: { pack: server-base,node,postgres,vite-react, why: a status tracker }
    drugs-register: { pack: server-base,java,postgres, why: an append-only legal register }
    roster-swap: { pack: server-base,rust, why: rule-heavy swap logic }
    website: { pack: server-base,django,postgres,server-rendered, why: clinics, hours and a new-client form }
    dental-month: { pack: server-base,go,postgres,vite-react, why: a campaign site with a booking request form }
  tidewell-grammar:
    excursion-consents: { pack: server-base,django,postgres,server-rendered, why: consent forms and medical notes }
    library-loans: { pack: server-base,rails,postgres,server-rendered, why: loans and a nightly overdue job }
    relief-board: { pack: server-base,rust, why: allocation rules }
    uniform-shop: { pack: server-base,dotnet,postgres, why: stock and orders }
    sports-results: { pack: frontend-only, why: a static results table }
    website: { pack: server-base,go,postgres,vite-react, why: an information site with an enquiry form }
    open-day: { pack: server-base,go,postgres,vite-react, why: an event site with tour bookings }
