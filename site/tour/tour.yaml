# The AppTown tour: the stops, in order. `make tour` photographs each one in
# the light and the dark theme and writes index.html from this file.
# path may use {review} (the change waiting for approval), {chat} (the
# change with a chat) and {session} (that chat's session).
stops:
  - id: before
    title: A perfectly sensible beginning
    caption: The cycling club has a newsletter and a ride calendar. Useful, but Tom has an idea.
    path: "{before}"
  - id: after
    title: Turn the neon up
    caption: Same club, louder shirt. Tom asks for an exuberant makeover while keeping the pages and links working. These are the actual example pages, rendered before and after the change.
    path: "{after}"
  - id: home
    title: Home
    caption: See your apps, recent work and anything that needs your attention. This example leaves one style check to fix and one approval to give.
    path: /
  - id: projects
    title: Projects
    caption: The team's apps, each with its way of working and what is running.
    path: /projects
  - id: new-project
    title: Start an app
    caption: Describe the app you want. AppTown suggests a name, then helps you choose how to build it and where to keep its code.
    path: /projects/_new
  - id: project
    title: An app's page
    caption: What the app is, its open changes, and where it runs.
    path: /projects/lunch-orders
  - id: chat
    title: Chat with the helper
    caption: Say what you want changed. A coding agent works on its own copy of the app, runs the tests, and says when there is something to try.
    path: /projects/lunch-orders/console?change={chat}
  - id: change
    title: A change, checked
    caption: Review what changed and what the checks found. Here, the tests passed but a style check needs fixing.
    path: /changes/{review}
  - id: infrastructure
    title: Infrastructure
    caption: The machines and services apps run on, and how much room each has.
    path: /infrastructure
  - id: conformance
    title: Conformance
    caption: See whether each app follows your team's ways of working, and what to fix. Some checks here need services the example does not run, so their results are shown as incomplete.
    path: /conformance
  - id: ways-of-working
    title: Ways of working
    caption: Share guidance, checks and workflows across your apps.
    path: /packs
  - id: usage
    title: Usage
    caption: See token use and how long each step takes, including time waiting for approval.
    path: /usage
  - id: people
    title: People
    caption: Choose who can use AppTown and what they can do.
    path: /people
  - id: docs
    title: Docs
    caption: The guides ship with AppTown and open inside it.
    path: /docs
