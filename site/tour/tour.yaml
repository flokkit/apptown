# The AppTown tour: the stops, in order. `make tour` photographs each one in
# the light and the dark theme and writes index.html from this file.
# The tour follows one change from asking to deciding, then shows the
# wider view. path may use {before} and {after} (the club site before and
# after the change), {story} (the neon makeover change, waiting for
# approval), {storySession} (its chat), {preview} (its running preview),
# {chat} (another change with a chat) and {session} (that chat's session).
# click is a button the camera clicks before the shot (it waits for the
# dialog). happy: true fails the run if the stop shows a failed or unknown
# status.
stops:
  - id: projects
    title: Projects
    caption: The team's apps, each one live and working.
    path: /projects
    happy: true
  - id: project
    title: An app's page
    caption: Club Newsletter's page shows what has gone live and where it runs. Open app shows the site as members see it.
    path: /projects/club-newsletter
    happy: true
  - id: before
    title: The site today
    caption: The club's newsletter and ride calendar. Useful, but Tom has an idea.
    path: "{before}"
  - id: chat
    title: Ask for a change
    caption: Tom asked for a neon makeover in a chat. A coding agent changed its own copy of the site, ran the link checks, and said when it was ready to try.
    path: /changes/{story}?tab=conversation
    happy: true
  - id: preview
    title: Try the preview
    caption: The change's preview runs the new site before anyone approves it. Once accepted and released, this is what club members see.
    path: "{preview}"
  - id: change
    title: The change, checked
    caption: What Tom asked for, what the agent says it did, the checks that passed, and the preview. It waits for Priya, who approves the newsletter's changes.
    path: /changes/{story}
    happy: true
  - id: decide
    title: Decide
    caption: Decide shows what was asked, the checks, and what accepting means. AppTown records who accepted and what they agreed to.
    path: /changes/{story}
    click: Decide…
    happy: true
  - id: home
    title: Home
    caption: Your apps, recent work and what needs your attention. Here, the makeover waits for approval.
    path: /
    happy: true
  - id: infrastructure
    title: A deployment target
    caption: A machine apps run on, how much room it has, and what runs there.
    path: /targets/built-in-docker
  - id: conformance
    title: Conformance
    caption: Whether each app follows your team's ways of working, and what to fix. Checks that need services the example does not run are shown as incomplete.
    path: /conformance
  - id: ways-of-working
    title: Ways of working
    caption: Guidance, checks and workflows, shared across your apps as packs.
    path: /packs
  - id: usage
    title: Usage
    caption: Token use and how long each step takes, including time waiting for approval.
    path: /usage
  - id: people
    title: People
    caption: Who can use AppTown and what they can do.
    path: /people/accounts
  - id: docs
    title: Docs
    caption: The guides ship with AppTown and open inside it.
    path: /docs
